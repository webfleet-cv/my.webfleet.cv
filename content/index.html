<main class="auth-stage" data-launcher data-product="webfleet" data-default-host="localhost" data-default-port="7336">
  <form class="auth-panel" data-config novalidate>
    <div class="brand-mark">WF</div><h1>Web Fleet</h1>
    <div class="error" data-error role="alert" hidden></div>
    <label>Domain or IP<input name="host" value="localhost" placeholder="localhost or https://webfleet.example.com" autocomplete="url" spellcheck="false"></label>
    <label>Port<input name="port" type="number" min="1" max="65535" value="7336" inputmode="numeric"></label>
    <div class="actions"><button type="submit">Save</button><button type="button" class="secondary" data-defaults>Use defaults</button></div>
    <button type="button" class="secondary open" data-open>Open</button>
  </form>
</main>
